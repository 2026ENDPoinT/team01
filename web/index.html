<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>성적 관리</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="logo" aria-hidden="true">G</span>
            <h1>성적 관리</h1>
        </div>
        <!-- data-roles: 그 탭을 볼 수 있는 역할 (로그인 후 app.js 가 나머지 탭을 숨김) -->
        <nav id="tabs" hidden>
            <button data-tab="courses" data-roles="admin professor student" class="active">수강과목</button>
            <button data-tab="enroll" data-roles="admin professor student">수강신청</button>
            <button data-tab="timetable" data-roles="student">시간표</button>
            <button data-tab="students" data-roles="admin">학생</button>
            <button data-tab="grades" data-roles="admin professor">성적</button>
            <button data-tab="myreport" data-roles="student">내 성적</button>
            <button data-tab="accounts" data-roles="admin">계정</button>
        </nav>
        <div id="user-box" hidden>
            <span id="user-label"></span>
            <button class="link" id="pw-change">비밀번호 변경</button>
            <button class="link" id="logout">로그아웃</button>
        </div>
    </header>

    <!-- 로그인 (로그인 전에는 상단 탭과 main 을 숨김) -->
    <section id="login-view" hidden>
        <form id="login-form" class="login-card">
            <h2>로그인</h2>
            <div class="field">
                <label for="login-username">아이디</label>
                <input id="login-username" name="username" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="login-password">비밀번호</label>
                <input id="login-password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <div class="form-error" id="login-error"></div>
            <button type="submit" class="primary">로그인</button>
            <!-- 시연 계정: 누르면 아이디·비밀번호를 채움 (app.js). 계정은 README 의 샘플 계정 표 -->
            <div class="demo-accounts">
                <p class="hint login-note">시연 계정 (누르면 입력됨)</p>
                <div class="demo-list">
                    <button type="button" class="demo-account" data-username="admin" data-password="admin1234">
                        <span class="demo-role">관리자</span><span class="demo-id">admin</span>
                    </button>
                    <button type="button" class="demo-account" data-username="kimcs" data-password="prof1234">
                        <span class="demo-role">교수</span><span class="demo-id">kimcs</span>
                    </button>
                    <button type="button" class="demo-account" data-username="23101001" data-password="student1234">
                        <span class="demo-role">학생</span><span class="demo-id">23101001</span>
                    </button>
                </div>
            </div>
        </form>
    </section>

    <main id="app" hidden>
        <!-- 수강과목 -->
        <section id="tab-courses" class="tab active">
            <div class="page-head">
                <h2 class="page-title">수강과목</h2>
                <button class="primary" id="course-add">+ 과목 등록</button>
            </div>
            <h3 class="sub-title">정규과목</h3>
            <ul id="course-list"></ul>
        </section>

        <!-- 수강신청 -->
        <section id="tab-enroll" class="tab">
            <div class="page-head">
                <h2 class="page-title">수강신청</h2>
                <span id="enroll-period" class="period"></span>
            </div>
            <!-- 관리자: 신청 학기 설정 -->
            <div class="toolbar setting-row" id="enroll-admin" hidden>
                <label for="enroll-set-sem">신청 학기 설정</label>
                <input id="enroll-set-sem" placeholder="예: 2026-2">
                <button id="enroll-set-save">저장</button>
                <button class="danger" id="enroll-set-close">신청 마감</button>
            </div>
            <div class="toolbar">
                <label id="enroll-student-wrap" hidden>학생 <select id="enroll-student"></select></label>
                <label id="enroll-course-wrap" hidden>과목 <select id="enroll-course"></select></label>
                <label>학기 <select id="enroll-sem-select"></select><input id="enroll-sem-input" placeholder="예: 2026-2" hidden></label>
            </div>
            <div id="enroll-content"></div>
        </section>

        <!-- 시간표 (학생 전용) -->
        <section id="tab-timetable" class="tab">
            <div class="page-head">
                <h2 class="page-title">시간표</h2>
            </div>
            <div id="timetable-content"><p class="hint">불러오는 중…</p></div>
        </section>

        <!-- 학생 -->
        <section id="tab-students" class="tab">
            <div class="page-head">
                <h2 class="page-title">학생</h2>
                <button class="primary" id="student-add">+ 학생 등록</button>
            </div>
            <div class="toolbar">
                <input id="student-search" type="search" placeholder="학번 또는 이름 검색">
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>학번</th><th>이름</th><th>학과</th><th>학년</th><th class="num">GPA</th><th>학사경고</th><th></th></tr></thead>
                    <tbody id="student-body"></tbody>
                </table>
            </div>
            <div id="student-pagination" class="pagination" hidden></div>
        </section>

        <!-- 성적 -->
        <section id="tab-grades" class="tab">
            <div class="page-head">
                <h2 class="page-title">성적</h2>
                <div class="grade-actions">
                    <button class="primary" id="grade-add">+ 성적 등록</button>
                </div>
            </div>
            <div class="toolbar">
                <select id="grade-f-student"></select>
                <select id="grade-f-course"></select>
                <select id="grade-f-semester"></select>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>학기</th><th>학번</th><th>이름</th><th>과목</th><th class="num">점수</th><th>등급</th><th></th></tr></thead>
                    <tbody id="grade-body"></tbody>
                </table>
            </div>
            <div id="grade-pagination" class="pagination" hidden></div>
        </section>

        <!-- 내 성적 (학생) -->
        <section id="tab-myreport" class="tab">
            <div class="page-head">
                <h2 class="page-title">내 성적</h2>
            </div>
            <div id="myreport-body"></div>
        </section>

        <!-- 계정 (관리자) -->
        <section id="tab-accounts" class="tab">
            <div class="page-head">
                <h2 class="page-title">계정</h2>
                <button class="primary" id="account-add">+ 계정 만들기</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>아이디</th><th>역할</th><th>이름</th><th>학번</th><th></th></tr></thead>
                    <tbody id="account-body"></tbody>
                </table>
            </div>
        </section>

        <!-- 과목 페이지 (화면 하나에 지금 고른 과목, app.js state.courseCode) -->
        <section id="tab-course" class="tab">
            <div id="course-hero" class="course-hero"></div>
            <div class="toolbar">
                <label for="course-sem">학기</label><select id="course-sem"></select>
                <div id="course-filter" class="chips"></div>
                <span class="spacer"></span>
                <button class="primary" id="post-add">+ 게시물 추가</button>
            </div>
            <div id="course-posts"></div>
            <!-- 평가 기준 (관리자·담당 교수만, app.js renderAssess): 학기 선택 + 6분류 비율·등급 방식 표 + 항목 점수 입력표 (+ 상대평가 요약 줄) -->
            <div id="assess-section" class="assess-section" hidden>
                <div class="toolbar">
                    <h3 class="sub-title">평가 기준</h3>
                    <label for="assess-sem">학기</label><select id="assess-sem"></select>
                    <span class="spacer"></span>
                    <button class="danger" id="assess-del" hidden>평가 기준 삭제</button>
                    <button class="primary" id="assess-add">평가 기준 설정</button>
                </div>
                <div id="assess-body"></div>
            </div>
            <!-- 출결 (관리자·담당 교수만, app.js renderAttend): 학기 선택 + 수강생 × 1~16주 출결 표 (넘치면 표 안에서 가로 스크롤) -->
            <div id="attend-section" class="assess-section" hidden>
                <div class="toolbar">
                    <h3 class="sub-title">출결</h3>
                    <label for="attend-sem">학기</label><select id="attend-sem"></select>
                    <span class="spacer"></span>
                    <span class="hint">칸을 누르고 출/지/결/공 중 하나를 고르면 바로 저장됩니다 (X = 기록 지우기) · 지각 3회 = 결석 1회 · 기록 없는 주차는 출석</span>
                </div>
                <div id="attend-body"></div>
            </div>
        </section>
    </main>

    <!-- 공용 입력 / 상세 대화상자 -->
    <dialog id="dlg">
        <form method="dialog" id="dlg-form">
            <h2 id="dlg-title"></h2>
            <div id="dlg-body"></div>
            <div class="dlg-actions">
                <button type="button" id="dlg-cancel">닫기</button>
                <button type="submit" class="primary" id="dlg-ok">저장</button>
            </div>
        </form>
    </dialog>

    <div id="toast" role="status"></div>
    <script src="app.js"></script>
</body>
</html>
