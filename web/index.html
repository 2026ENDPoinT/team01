<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>성적 관리</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="logo" aria-hidden="true">G</span>
            <h1>성적 관리</h1>
        </div>
        <div class="topbar-actions">
            <button class="primary" id="course-add">+ 과목 등록</button>
        </div>
    </header>

    <main>
        <h2 class="page-title">수강과목</h2>
        <h3 class="sub-title">정규과목</h3>
        <ul id="course-list"></ul>
    </main>

    <!-- 공용 입력 / 상세 대화상자 -->
    <dialog id="dlg">
        <form method="dialog" id="dlg-form">
            <h2 id="dlg-title"></h2>
            <div id="dlg-body"></div>
            <div class="dlg-actions">
                <button type="button" id="dlg-cancel">닫기</button>
                <button type="submit" class="primary" id="dlg-ok">저장</button>
            </div>
        </form>
    </dialog>

    <div id="toast" role="status"></div>
    <script src="app.js"></script>
</body>
</html>
